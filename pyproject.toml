[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.13,<0.13.0" ]

[project]
name = "pypkgtest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "Andrew Gene Brown", email = "andrew.g.brown@usda.gov" } ]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "numpy" ]
scripts.pypkgtest = "pypkgtest:main"

[dependency-groups]
dev = [
  "codespell>=2.4.3",
  "deptry>=0.25.1",
  "pyproject-fmt>=2.29.3",
  "ruff>=0.16.7",
  "usethis>=0.22.0",
]
test = [
  "coverage[toml]>=7.16.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]
doc = [
  "mkdocs>=1.6.1",
]

[tool.uv]
default-groups = [ "doc", "dev", "test" ]
link-mode = "symlink"

[tool.ruff]
line-length = 88
format.docstring-code-format = true
lint.select = [ "A", "C4", "E4", "E7", "E9", "F", "FLY", "FURB", "I", "PLE", "PLR", "PT", "RUF", "SIM", "UP" ]
lint.ignore = [ "PLR2004", "SIM108" ]
lint.per-file-ignores."!tests/**/*.py" = [ "PT" ]

[tool.codespell]
skip = "./site"

[tool.deptry]
ignore_notebooks = false

[tool.pyproject-fmt]
keep_full_version = true

[tool.pytest]
ini_options.minversion = "7"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib", "-ra", "--strict-markers", "--strict-config" ]
ini_options.xfail_strict = true
ini_options.filterwarnings = [ "error" ]
ini_options.log_cli_level = "INFO"

[tool.coverage]
report.omit = [ "*/pytest-of-*/*" ]
report.exclude_also = [
  "@(abc\\.)?abstractmethod",
  "assert_never(.*)",
  "class .*\\bProtocol\\):",
  "if TYPE_CHECKING:",
  "msg = [\"']",
  "raise AssertionError",
  "raise NotImplementedError",
]
